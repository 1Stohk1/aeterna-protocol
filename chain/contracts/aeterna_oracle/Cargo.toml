[package]
name          = "aeterna-oracle"
version       = "0.5.0"
edition       = "2021"
description   = "aeterna_oracle CosmWasm smart contract - validates PoUW blocks and calculates node Trust Scores."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = { version = "2.0", features = ["stargate"] }
cosmwasm-storage = "1.0"
cw-storage-plus = "2.0"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"
crystals-dilithium = "2.0.0"
cosmwasm-schema = "2.0"
getrandom = { version = "0.2", features = ["custom"] }
prost = "0.12"



